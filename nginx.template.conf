map $http_authorization $final_auth_header {
    default $http_authorization;
    ""      "Bearer ${OPENROUTER_API_KEY}";
}

server {
    listen 80;

    # Encapsulated reverse proxy for OpenRouter API requests
    location /api/openrouter/ {
        proxy_pass https://openrouter.ai/api/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host openrouter.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $final_auth_header;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
