<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Japanese · Learn a little, every day</title>
    <meta
      name="description"
      content="Your Japanese study space: N5–N1 kanji flashcards, kanji building courses, particles, hiragana, katakana, reading practice, and detailed translations."
    />
    <meta name="theme-color" content="#fbf9f8" />
    <link rel="canonical" href="https://translate.nevatal.tech/" />
    <link rel="icon" type="image/svg+xml" href="/sakura.svg" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Gemini Japanese · Learn a little, every day"
    />
    <meta
      property="og:description"
      content="Build your Japanese, one step at a time. Kanji, kana, grammar, and reading practice from N5 to N1."
    />
    <meta property="og:url" content="https://translate.nevatal.tech/" />
    <meta property="og:site_name" content="Gemini Japanese" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var savedTheme = localStorage.getItem("sakura-theme");
        var theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gemini Japanese",
        "url": "https://translate.nevatal.tech/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "inLanguage": ["en", "ja"],
        "description": "Japanese study with kanji flashcards, component-building challenges, kana, grammar, reading practice, and a detailed translator."
      }
    </script>
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" />
    <script id="webmcp-tools">
    (function() {
      const webMcpTools = [
        {
          name: "translate_text",
          description: "Translate Japanese text to English or vice-versa with grammar and vocabulary breakdown",
          inputSchema: {
            type: "object",
            properties: {
              text: { type: "string", description: "Text to translate" },
              targetLanguage: { type: "string", enum: ["en", "ja"], description: "Target language code" }
            },
            required: ["text"]
          },
          execute: async function(args) {
            const res = await fetch("/api/translate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(args || {})
            });
            return await res.json();
          }
        },
        {
          name: "lookup_kanji",
          description: "Lookup Japanese kanji stroke order, components, and JLPT level",
          inputSchema: {
            type: "object",
            properties: {
              kanji: { type: "string", description: "Kanji character to search" }
            },
            required: ["kanji"]
          },
          execute: async function(args) {
            return { status: "success", query: args.kanji };
          }
        },
        {
          name: "check_translation_health",
          description: "Check the status and health of the Gemini Japanese translation service",
          inputSchema: {
            type: "object",
            properties: {}
          },
          execute: async function() {
            const res = await fetch("/api/health");
            return await res.json();
          }
        }
      ];

      function registerTools() {
        if (typeof navigator !== "undefined" && navigator.modelContext) {
          if (typeof navigator.modelContext.provideContext === "function") {
            try { navigator.modelContext.provideContext({ tools: webMcpTools }); } catch(e) {}
          }
          if (typeof navigator.modelContext.registerTool === "function") {
            webMcpTools.forEach(tool => {
              try { navigator.modelContext.registerTool(tool); } catch(e) {}
            });
          }
        }
        if (typeof document !== "undefined" && document.modelContext) {
          if (typeof document.modelContext.provideContext === "function") {
            try { document.modelContext.provideContext({ tools: webMcpTools }); } catch(e) {}
          }
          if (typeof document.modelContext.registerTool === "function") {
            webMcpTools.forEach(tool => {
              try { document.modelContext.registerTool(tool); } catch(e) {}
            });
          }
        }
      }

      registerTools();
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", registerTools);
      }
      window.addEventListener("load", registerTools);
      let count = 0;
      const interval = setInterval(function() {
        registerTools();
        if (++count > 20) clearInterval(interval);
      }, 250);
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
