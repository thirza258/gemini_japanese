<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Japanese · Learn a little, every day</title>
    <meta
      name="description"
      content="Your Japanese study space: N5–N1 kanji flashcards, kanji building courses, particles, hiragana, katakana, reading practice, and detailed translations."
    />
    <meta name="theme-color" content="#fbf9f8" />
    <link rel="canonical" href="https://translate.nevatal.tech/" />
    <link rel="icon" type="image/svg+xml" href="/sakura.svg" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Gemini Japanese · Learn a little, every day"
    />
    <meta
      property="og:description"
      content="Build your Japanese, one step at a time. Kanji, kana, grammar, and reading practice from N5 to N1."
    />
    <meta property="og:url" content="https://translate.nevatal.tech/" />
    <meta property="og:site_name" content="Gemini Japanese" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var savedTheme = localStorage.getItem("sakura-theme");
        var theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gemini Japanese",
        "url": "https://translate.nevatal.tech/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "inLanguage": ["en", "ja"],
        "description": "Japanese study with kanji flashcards, component-building challenges, kana, grammar, reading practice, and a detailed translator."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
