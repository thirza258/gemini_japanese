services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_OPENROUTER_MODEL: ${VITE_OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it}
        VITE_OPENROUTER_ENDPOINT: ${VITE_OPENROUTER_ENDPOINT:-/api/openrouter/chat/completions}
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Local HTTP preview. Set COOKIE_SECURE=true when using HTTPS in production.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "5175:3000"
    volumes:
      - learning-data:/app/data
    restart: unless-stopped

volumes:
  learning-data:
